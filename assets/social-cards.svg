<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120" role="img" aria-labelledby="title desc">
  <title id="title">Social profiles</title>
  <desc id="desc">Informational cards for LinkedIn and Instagram. They are not interactive buttons.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1022"/><stop offset="1" stop-color="#101A36"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="418" height="118" rx="18" fill="url(#panel)" stroke="#3B4D7A"/>
  <circle cx="45" cy="42" r="19" fill="url(#blue)"/><text x="45" y="49" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="20" font-weight="700">in</text>
  <text x="78" y="39" fill="#E6EDFF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">LinkedIn</text>
  <text x="78" y="66" fill="#8EA4C7" font-family="Inter,Arial,sans-serif" font-size="13">monsserratt-esquivel-gonzález</text>
  <text x="24" y="98" fill="#35C7FF" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.2">PROFESSIONAL ORBIT</text>
  <rect x="441" y="1" width="418" height="118" rx="18" fill="url(#panel)" stroke="#493B75"/>
  <circle cx="485" cy="42" r="19" fill="url(#purple)"/><circle cx="485" cy="42" r="8" fill="none" stroke="white" stroke-width="2"/><circle cx="493" cy="34" r="2" fill="white"/>
  <text x="518" y="39" fill="#E6EDFF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Instagram</text>
  <text x="518" y="66" fill="#8EA4C7" font-family="Inter,Arial,sans-serif" font-size="13">profile coming soon</text>
  <text x="464" y="98" fill="#B794F6" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.2">CREATIVE SIGNAL</text>
