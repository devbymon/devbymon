<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="210" viewBox="0 0 1180 210" role="img" aria-labelledby="title desc">
  <title id="title">Mon — Information Systems Engineer</title>
  <desc id="desc">Neon purple and blue identity panel with the phrase Building technology with positive impact.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset=".55" stop-color="#101632"/>
      <stop offset="1" stop-color="#071427"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B794F6"/>
      <stop offset=".5" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#35C7FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="1178" height="208" rx="24" fill="url(#bg)" stroke="#283A64" stroke-width="2"/>
  <circle cx="82" cy="54" r="2" fill="#74E7FF"/><circle cx="1080" cy="48" r="2" fill="#B794F6"/>
  <circle cx="1040" cy="166" r="1.5" fill="#74E7FF"/><circle cx="142" cy="172" r="1.5" fill="#B794F6"/>
  <path d="M310 144H870" stroke="url(#neon)" stroke-width="1" opacity=".55"/>
  <text x="590" y="67" text-anchor="middle" fill="url(#neon)" filter="url(#glow)" font-family="Inter,ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="43" font-weight="800" letter-spacing="8">MON</text>
  <text x="590" y="111" text-anchor="middle" fill="#E6EDFF" font-family="Inter,ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600" letter-spacing="2.4">INFORMATION SYSTEMS ENGINEER</text>
  <text x="590" y="178" text-anchor="middle" fill="#8EA4C7" font-family="Inter,ui-sans-serif,-apple-system,Segoe UI,sans-serif" font-size="17" letter-spacing="1.6">BUILDING TECHNOLOGY WITH POSITIVE IMPACT</text>
</svg>
